[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchreplicator"
version = "0.1.0"
description = "Synthetic-only research setup extraction, planning, tracking, and comparison"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
repkit = "repkit.cli:main"

[tool.setuptools.packages.find]
include = ["repkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
